# Fly.io — the cheaper of the two options, but needs the flyctl CLI.
#
#   fly launch --no-deploy --copy-config --name cu-os-api --region sin
#   fly volumes create cuos_data --region sin --size 1
#   fly secrets set CU_JWT_SECRET="$(openssl rand -hex 32)"
#   fly deploy

app = "cu-os-api"
primary_region = "sin"          # Singapore — same region as the users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CU_DATABASE_URL = "sqlite:////data/cuos.db"
  CU_WHATSAPP_PROVIDER = "fake"
  # The deployed frontend. Add more origins comma-separated.
  CU_CORS_ORIGINS = "https://cu-os-six.vercel.app,https://cu-os-community-unlimited.vercel.app"

# SQLite needs real disk. Without this the database is empty after every deploy.
[[mounts]]
  source = "cuos_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A webhook endpoint must always answer. Meta retries on non-200, and a cold
  # start reads as a failure, so the machine is kept warm rather than scaled to
  # zero. One machine only — the reminder sweep is in-process.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
