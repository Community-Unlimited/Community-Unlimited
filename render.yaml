# Render blueprint — ONE service for the whole app (CU-OS API + React SPA)
#
# The root Dockerfile builds the React SPA and copies it into the Python image,
# which serves it from the same origin as /api. That means no CORS, no
# VITE_API_BASE_URL, one URL, and one service to pay for.
#
# The persistent SQLite database lives on a 1GB mounted volume at /data.
# The WhatsApp engine connects to the persistent external Oracle Cloud bridge
# (https://whatsapp.rejey-services.tech), so NO extra container/cost is needed.
#
# Total cost: Starter plan ($7/mo) + 1GB persistent disk ($0.25/mo) = ~$7.25 / month.

services:
  - type: web
    name: cu-os-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: cuos-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CU_DATABASE_URL
        value: sqlite:////data/cuos.db
      - key: CU_STATIC_DIR
        value: /app/static
      # WhatsApp Provider defaults to Oracle Cloud persistent bridge
      - key: CU_WHATSAPP_PROVIDER
        value: oracle
      - key: CU_ORACLE_WHATSAPP_URL
        value: https://whatsapp.rejey-services.tech
      - key: CU_ORACLE_WHATSAPP_TOKEN
        sync: false
      - key: CU_ORACLE_WHATSAPP_USER_ID
        sync: false
      - key: CU_JWT_SECRET
        generateValue: true
      - key: CU_ADMIN_EMAIL
        value: admin@communityunlimited.sg
      - key: CU_ADMIN_PASSWORD
        sync: false
      - key: CU_CORS_ORIGINS
        sync: false

      # Optional fallback: Meta WhatsApp Cloud API
      - key: CU_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: CU_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: CU_WHATSAPP_APP_SECRET
        sync: false
      - key: CU_WHATSAPP_VERIFY_TOKEN
        sync: false

      # Optional fallback: Twilio
      - key: CU_TWILIO_ACCOUNT_SID
        sync: false
      - key: CU_TWILIO_AUTH_TOKEN
        sync: false
      - key: CU_TWILIO_API_KEY_SID
        sync: false
      - key: CU_TWILIO_API_KEY_SECRET
        sync: false
      - key: CU_TWILIO_WHATSAPP_FROM
        sync: false
      - key: CU_TWILIO_WEBHOOK_URL
        sync: false
      - key: CU_TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: CU_TWILIO_CONTENT_SID_EVENT_INVITE
        sync: false
