# Render blueprint — ONE service for the whole app.
#
# The root Dockerfile builds the React SPA and copies it into the Python image,
# which serves it from the same origin as /api. That means no CORS, no
# VITE_API_BASE_URL, one URL and one thing to pay for.
#
# No CLI needed: in the Render dashboard choose New > Blueprint and point it at
# this repo.
#
# PLAN: a persistent disk requires a paid instance (Starter, ~US$7/mo). On the
# free plan there is no disk and the service sleeps after inactivity, so SQLite
# data is lost on restart and the first webhook after a sleep times out. Free
# is fine for a demo; not for real registrations.

services:
  - type: web
    name: cu-os-api
    runtime: docker
    # Build context is the repo root — the image needs both frontend/ and
    # backend/.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    # One instance only: the reminder sweep is an in-process loop and a second
    # instance double-sends.
    numInstances: 1
    disk:
      name: cuos-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CU_DATABASE_URL
        value: sqlite:////data/cuos.db
      # Set by the Dockerfile too; explicit here so it is visible in the
      # dashboard.
      - key: CU_STATIC_DIR
        value: /app/static
      - key: CU_WHATSAPP_PROVIDER
        value: fake
      - key: CU_JWT_SECRET
        generateValue: true
      - key: CU_ADMIN_EMAIL
        value: admin@communityunlimited.sg
      # Set a real value in the dashboard — leaving this unset seeds the
      # default password, which must never reach a public URL.
      - key: CU_ADMIN_PASSWORD
        sync: false
      # Only needed if a separate frontend origin (e.g. Vercel) is kept.
      # Same-origin serving needs no CORS at all.
      - key: CU_CORS_ORIGINS
        sync: false
      - key: CU_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: CU_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: CU_WHATSAPP_APP_SECRET
        sync: false
      - key: CU_WHATSAPP_VERIFY_TOKEN
        sync: false
      # --- Twilio (set CU_WHATSAPP_PROVIDER=twilio to activate) -------------
      # All sync:false — secrets are entered in the dashboard, never here.
      - key: CU_TWILIO_ACCOUNT_SID
        sync: false
      # Required even when sends use the API key pair: inbound webhook
      # signatures are keyed on the auth token and nothing else validates them.
      - key: CU_TWILIO_AUTH_TOKEN
        sync: false
      - key: CU_TWILIO_API_KEY_SID
        sync: false
      - key: CU_TWILIO_API_KEY_SECRET
        sync: false
      - key: CU_TWILIO_WHATSAPP_FROM
        sync: false
      # Set this to the deployed URL of the webhook, exactly as registered in
      # the Twilio console — e.g.
      #   https://cu-os-api.onrender.com/api/whatsapp/twilio/webhook
      # Render terminates TLS, so a URL rebuilt from the request arrives as
      # http:// and the signature check fails with a 401 that reads like bad
      # credentials. Setting it explicitly removes that failure mode.
      - key: CU_TWILIO_WEBHOOK_URL
        sync: false
      - key: CU_TWILIO_STATUS_CALLBACK_URL
        sync: false
      - key: CU_TWILIO_CONTENT_SID_EVENT_INVITE
        sync: false
